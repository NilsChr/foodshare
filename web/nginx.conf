server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Hashed build output never changes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and manifest must be revalidated, or clients never see a new version.
  location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # nginx's mime.types does not know .webmanifest.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Client-side routes fall back to the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
